<!doctype html>
<html lang="zh-CN">
<head><script src="/accept-all-cookies/cookie-quest/integration/frame-bridge.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DESERT DISCO · 迪拜软曲奇</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" aria-label="DESERT DISCO 广告播放器">
    <video id="advert" controls playsinline preload="auto" poster="./assets/images/poster.webp" aria-label="DESERT DISCO 26 秒广告">
      <source src="./assets/video/desert-disco.mp4" type="video/mp4">
      当前浏览器无法播放此视频，请使用支持 MP4 的浏览器。
    </video>
    <div id="error" class="error" role="alert" hidden>视频未能载入，请确认文件夹完整后重新打开。</div>
  </main>
  <footer class="transport">
    <button id="play" type="button">播放</button>
    <button id="replay" type="button">重播</button>
    <button id="sound" type="button" aria-pressed="false">静音</button>
    <span id="status" role="status" aria-live="polite">准备播放</span>
    <output id="time" aria-label="播放进度">00:00 / 00:26</output>
  </footer>
  <script src="./module.js"></script>
</body>
</html>
