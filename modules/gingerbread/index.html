<!doctype html>
<html lang="zh-CN"><script src="/accept-all-cookies/cookie-quest/integration/frame-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Very Sweet Christmas — 姜饼人的圣诞广告</title>
<style>
html{background:#211a17;color:#eadbc3;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}#ad{width:min(1100px,100%,calc((100svh - 100px)*16/9))}.reopen{border:2px outset #fff;background:#c0c0c0;border-radius:0;padding:10px 20px;color:#111;cursor:pointer}.closed{text-align:center;width:100%;padding:70px 0}.closed p{font-size:14px}[hidden]{display:none!important}@media(max-width:500px){body{padding:8px}}
</style>
<div id="ad"></div>
<script src="film.js"></script>
<script src="gingerbread.js"></script>
<script>
const host = document.getElementById('ad');
function mount(){
  host.replaceChildren();
  window.gingerbread = GingerbreadAd.mount(host,{onClose(){
    host.innerHTML='<div class="closed"><p>广告窗口已关闭</p><button class="reopen">重新打开广告</button></div>';
    host.querySelector('button').addEventListener('click',mount);
  }});
}
host.addEventListener('cookie',event=>{
  window.lastCookieEvent={...event.detail};
  // The preview records this event only. It never advances a parent story.
});
mount();
</script>
</html>
