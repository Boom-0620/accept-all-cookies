<!doctype html>
<html lang="zh-CN"><script src="/accept-all-cookies/cookie-quest/integration/frame-bridge.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Very Sweet Christmas — 完整影片</title>
<style>html{background:#170f0f;color:#f4dfaf;font:14px Georgia,serif}body{margin:0;min-height:100vh;display:grid;place-content:center;padding:20px;box-sizing:border-box}main{width:min(850px,calc(100vw - 40px))}canvas{width:100%;display:block;aspect-ratio:16/9;background:#000}footer{display:flex;gap:15px;align-items:center;margin-top:15px}button{padding:8px 18px;background:#8b1a21;border:1px solid #c49a51;color:#f8e6bc;font:inherit;cursor:pointer}a{color:inherit;margin-left:auto}p{font-size:12px;letter-spacing:2px}output{font:12px monospace}[hidden]{display:none}</style>
<main><p>A VERY SWEET CHRISTMAS · 1996</p><canvas></canvas><audio hidden></audio><footer><button id="play">▶ PLAY</button><button id="stop">■ 停止</button><output>00:00 / 00:25</output><a href="index.html">广告窗口 ↗</a></footer></main>
<script src="film.js"></script><script>
const film=GingerbreadFilm.create(document.querySelector('canvas'),document.querySelector('audio'),new URL('./assets/',location.href));
const button=document.getElementById('play');
button.onclick=async()=>{if(film.paused||film.ended){try{await film.play();}catch(e){button.textContent='加载失败，请重试';}}else film.pause();};
document.getElementById('stop').onclick=()=>{film.pause();film.currentTime=0;document.querySelector('output').textContent='00:00 / 00:25';};
film.addEventListener('playing',()=>{button.textContent='Ⅱ 暂停';});
film.addEventListener('pause',()=>{button.textContent='▶ 继续';});
film.addEventListener('timeupdate',()=>{document.querySelector('output').textContent='00:'+String(Math.floor(film.currentTime)).padStart(2,'0')+' / 00:25';});
film.addEventListener('ended',()=>{button.textContent='↻ 重播';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)film.pause();});
window.addEventListener('pagehide',()=>film.release());
</script></html>
