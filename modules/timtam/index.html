<!doctype html>
<html lang="zh-CN"><head><script src="/accept-all-cookies/cookie-quest/integration/frame-bridge.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tim Tam Slam · 吸管竞赛</title><style>
*{box-sizing:border-box}body{margin:0;background:#008080;font-family:Tahoma,Arial,'PingFang SC',sans-serif;color:#e0f0e8;min-height:100vh;display:grid;place-items:center;padding:50px 20px 70px}.preview{width:min(100%,900px)}.taskbar{position:fixed;bottom:0;left:0;right:0;background:#c0c0c0;border-top:2px solid white;height:32px;display:flex;align-items:center;padding:3px 5px;gap:8px;color:#222;font-size:11px}.taskbar button{border:2px solid;border-color:#fff #444 #444 #fff;font-weight:bold;background:#c0c0c0;height:25px}.taskbar .task{border:2px solid;border-color:#777 white white #777;padding:3px 12px;background:#d4d4d4}.clock{margin-left:auto;border:1px solid;border-color:#777 white white #777;padding:4px 12px}.closed{padding:30px;text-align:center;font-size:13px}.closed button{padding:8px 18px;margin-top:10px}body.embed{background:transparent;padding:0;display:block;min-height:0}.embed .preview{width:100%;max-width:none}.embed .eyebrow,.embed h1,.embed .preview-note,.embed .taskbar{display:none}a{color:inherit}#module{width:100%}
</style></head><body><main class="preview"><div id="module"></div><div id="closed" class="closed" hidden>广告窗口已关闭。<br><button id="reopen">重新打开广告</button></div></main><footer class="taskbar"><button id="start-menu">▦ 开始</button><span class="task">Tim Tam Slam</span><span class="clock">1998 · PROMO</span></footer><script src="./timtam.js"></script><script>
(function(){
 const params=new URLSearchParams(location.search), embed=params.get('embed')==='1';
 if(embed) document.body.classList.add('embed');
 let parentOrigin=location.origin;
 if(params.has('parentOrigin')){try{const u=new URL(params.get('parentOrigin'));if(/^https?:$/.test(u.protocol))parentOrigin=u.origin;}catch(e){}}
 const mount=document.getElementById('module');
 function send(data){if(embed && parent!==window && parentOrigin!=='null')parent.postMessage(data,parentOrigin);}
 function open(){document.getElementById('closed').hidden=true;window.timtam=CookieTimTam.create(mount,{onClose(){document.getElementById('closed').hidden=embed;send({type:'timtam:close',projectId:'timtam'});}});}
 mount.addEventListener('cookie',e=>send({type:'cookie',...e.detail}));
 document.getElementById('reopen').onclick=open;
 document.getElementById('start-menu').onclick=()=>{if(window.timtam.getState().destroyed)open();};
 window.addEventListener('message',e=>{if(!embed||e.source!==parent||e.origin!==parentOrigin||e.data?.channel!=='cookie:timtam')return;const m=e.data;switch(m.action){case 'pause':timtam.pause();break;case 'resume':timtam.resume();break;case 'setActive':timtam.setActive(m.active===true);break;case 'destroy':timtam.destroy();break;}});
 open();
})();
</script></body></html>
